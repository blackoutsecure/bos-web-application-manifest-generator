# GitHub Marketplace Categories (selected during release UI):
# Primary: Continuous integration
# Secondary: Utilities

name: 'Blackout Secure Web Application Manifest Generator'
description: 'Generate W3C-compliant web application manifest files for Progressive Web Apps with full customization'
author: 'Blackout Secure'
branding:
  icon: 'file-text'
  color: 'blue'

runs:
  using: 'node20'
  main: 'dist/index.js'

inputs:
  # Manifest members
  name:
    description: 'Application name (displayed to users)'
    required: false
    default: ''

  short_name:
    description: 'Short application name (for limited space)'
    required: false
    default: ''

  description:
    description: 'Description of the web application'
    required: false

  # URL members
  start_url:
    description: 'URL to load when launching the app (default: /)'
    required: false
    default: '/'

  scope:
    description: 'Navigation scope of the app (default: /)'
    required: false
    default: '/'

  id:
    description: 'Unique identifier for the application'
    required: false

  # Display and orientation
  display:
    description: 'Display mode: fullscreen, standalone, minimal-ui, or browser (default: standalone)'
    required: false
    default: 'standalone'

  orientation:
    description: 'Default screen orientation: any, natural, landscape, portrait, portrait-primary, portrait-secondary, landscape-primary, landscape-secondary'
    required: false
    default: 'any'

  # Colors
  theme_color:
    description: 'Theme color for the application (hex, rgb, or named color) (default: #ffffff)'
    required: false
    default: '#ffffff'

  background_color:
    description: 'Background color while loading (hex, rgb, or named color) (default: #ffffff)'
    required: false
    default: '#ffffff'

  # Internationalization
  lang:
    description: 'Primary language tag (e.g., en-US, fr, ja)'
    required: false

  dir:
    description: 'Text direction: ltr, rtl, or auto'
    required: false

  # Icons and visual elements
  icons:
    description: 'JSON array of icon objects with src, sizes, type, and optional purpose (`any`, `maskable`, `monochrome`). Defaults use maskable.'
    required: false

  shortcuts:
    description: 'JSON array of shortcut objects with name, url, description, and icons properties'
    required: false

  categories:
    description: 'Comma-separated list of application categories'
    required: false

  # Asset configuration
  icons_dir:
    description: 'Default directory path for icon assets (default: /icons/). Used for convenience when building icon URLs'
    required: false
    default: '/icons/'

  # Page injection configuration
  inject_manifest_link:
    description: 'Inject manifest link into page files (default: true)'
    required: false
    default: 'true'

  inject_pwa_meta_tags:
    description: 'Inject PWA meta tags into page files (theme-color, mobile-web-app-capable, etc.) (default: true)'
    required: false
    default: 'true'

  inject_favicon_links:
    description: 'Inject favicon link tags into page files (default: true)'
    required: false
    default: 'true'

  inject_mobile_web_app_capable:
    description: 'Inject mobile-web-app-capable meta tag (default: true)'
    required: false
    default: 'true'

  crossorigin_credentials:
    description: 'Add crossorigin="use-credentials" to manifest link (default: false)'
    required: false
    default: 'false'

  inject_manifest_link_exts:
    description: 'File extensions to scan for page injection, space-separated. Recommended: html htm xhtml php phtml (default: html htm xhtml php phtml)'
    required: false
    default: 'html htm xhtml php phtml'

  validate_manifest_assets:
    description: 'Validate manifest assets (icon file existence). Always warns, never fails. (default: true)'
    required: false
    default: 'true'

  # Output configuration
  public_dir:
    description: 'Public directory where the manifest file will be written (e.g., dist, public, build)'
    required: true

  filename:
    description: 'Output manifest filename (default: site.webmanifest)'
    required: false
    default: 'site.webmanifest'

  # Artifact upload configuration
  upload_artifacts:
    description: 'Upload generated manifest to GitHub artifacts (default: true)'
    required: false
    default: 'true'

  artifact_name:
    description: 'Name for the uploaded artifact (default: web-manifest)'
    required: false
    default: 'web-manifest'

  artifact_retention_days:
    description: 'Number of days to retain the artifact (1-90, default: repository settings)'
    required: false

  # Layered configuration
  config_path:
    description: 'Explicit repository config file. Leave empty to auto-discover `.github/bos-universal-config.json|yml`, `bos-universal-config.*`, or `.bos-web-manifest.yml` under the workspace root.'
    required: false

  global_config_path:
    description: 'Organization-level global config path, merged beneath the repository config.'
    required: false
    default: '.github/blackout-secure-web-application-manifest-generator-global-config.yml'

  use_global_config:
    description: 'Global config tier: auto (load when present), true (require it), or false (disable discovery).'
    required: false
    default: 'auto'

  use_marketplace_config:
    description: 'Apply the bundled marketplace baseline config as the lowest precedence tier.'
    required: false
    default: 'true'

  # Audit and reporting
  enable_audit:
    description: 'Run the W3C manifest / PWA installability audit after generation. Rule severities come from `web_manifest.audit.rules` in config.'
    required: false
    default: 'true'

  audit_fail_on:
    description: 'Audit exit policy: fail (non-zero on any fail/error finding) or never. Leave empty to use `web_manifest.audit.fail_on` from config.'
    required: false

  sarif_output:
    description: 'Path to write audit findings as SARIF 2.1.0 for GitHub code scanning upload. Empty disables SARIF output.'
    required: false

  report_json:
    description: 'Path to write the machine-readable JSON audit report. Empty disables the report.'
    required: false
  redact_sensitive:
    description: 'Redact credential-shaped values from console and report surfaces. Leave empty to use redaction.enabled from config.'
    required: false
    default: ''
  redaction_placeholder:
    description: 'Replacement text for redacted values. Leave empty to use redaction.placeholder from config.'
    required: false
    default: ''

  recommendations_json:
    description: 'Path to write structured remediation recommendations for non-pass findings. Empty disables the sidecar.'
    required: false

  skips_json:
    description: 'Path to write the skipped-controls sidecar. SARIF drops `skip` findings, so this is the only machine-readable record of unassessed controls.'
    required: false

  step_summary:
    description: 'Append the Markdown audit report to $GITHUB_STEP_SUMMARY.'
    required: false
    default: 'true'

  enable_ai_summary:
    description: 'Generate a short natural-language findings summary. Falls back to a deterministic local summary when no provider is available.'
    required: false
    default: 'true'

  ai_provider:
    description: 'AI summary provider: auto (GitHub Models when a token is present), none, or a named provider backed by <NAME>_API_KEY and <NAME>_API_ENDPOINT.'
    required: false
    default: 'auto'

outputs:
  manifest_path:
    description: 'Path to the generated manifest file'
  manifest_json:
    description: 'Generated manifest as JSON string'
  config_sources:
    description: 'Comma-separated list of the applied config tiers, in precedence order'
  audit_verdict:
    description: 'Overall audit verdict: Pass, Review recommended, Action required, Inconclusive, or Not assessed'
  audit_pass_count:
    description: 'Number of audit controls that passed'
  audit_warn_count:
    description: 'Number of audit controls that produced a warning'
  audit_fail_count:
    description: 'Number of audit controls that failed'
  audit_error_count:
    description: 'Number of audit controls that could not be evaluated'
  audit_skip_count:
    description: 'Number of audit controls that were not assessed'
  sarif_path:
    description: 'Path to the written SARIF file, when sarif_output is set'
  report_json_path:
    description: 'Path to the written JSON audit report, when report_json is set'
  recommendations_json_path:
    description: 'Path to the written recommendations sidecar, when recommendations_json is set'
  ai_summary:
    description: 'Short natural-language summary of the audit findings'
